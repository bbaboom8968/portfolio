<!DOCTYPE html>
<html lang="en-us">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F1TY4PQ7R1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F1TY4PQ7R1');
    </script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Portfolio</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #232323; overflow: hidden; font-family: sans-serif; }
      
      /* 🌟 가로세로 비율 제한 없이 브라우저 창을 100% 꽉 채우는 유동형 스타일 */
      #unity-container {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; margin: 0 !important;
      }
      
      /* 🔄 모바일 세로 화면일 때 나타날 가로 회전 안내창 스타일 */
      #rotate-notice {
        display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%;
        background-color: #1a1a1a; color: #ffffff; z-index: 9999;
        flex-direction: column; justify-content: center; align-items: center; text-align: center;
      }
      #rotate-notice .icon { font-size: 48px; margin-bottom: 20px; animation: rotateDevice 2s infinite ease-in-out; }
      #rotate-notice .text { font-size: 18px; line-height: 1.6; font-weight: bold; padding: 0 20px; }
      
      @keyframes rotateDevice {
        0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); }
      }

      /* 📱 모바일/태블릿 기기에서 세로 상태(Portrait)일 때 유니티를 숨기고 회전 안내창을 표시 */
      @media (orientation: portrait) and (max-width: 1024px) {
        #rotate-notice { display: flex; }
        #unity-container { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="rotate-notice">
      <div class="icon">🔄</div>
      <div class="text">본 포트폴리오는 가로 화면에 최적화되어 있습니다.<br>안정적인 화면 구현을 위해 기기를 가로로 회전해 주세요!</div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Portfolio</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web_Build_Test.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web_Build_Test.data.unityweb",
        frameworkUrl: buildUrl + "/Web_Build_Test.framework.js.unityweb",
        codeUrl: buildUrl + "/Web_Build_Test.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Portfolio",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // 🌟 창 크기나 기기 해상도가 바뀔 때마다 1:1로 유연하게 늘려주는 화면 동기화 함수
      function respondToWindow() {
        var finalWidth = window.innerWidth;
        var finalHeight = window.innerHeight;

        container.style.width = finalWidth + "px";
        container.style.height = finalHeight + "px";
        canvas.style.width = finalWidth + "px";
        canvas.style.height = finalHeight + "px";
      }

      // 모바일 기기 검사 및 뷰포트 메타태그 선언 오류 수정
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      // 데스크톱 리사이즈 및 모바일 화면 회전 이벤트 감지 등록
      window.addEventListener('resize', respondToWindow);
      window.addEventListener('orientationchange', respondToWindow);
      respondToWindow();

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          
          // 🌟 자동 풀스크린 명령은 철저히 배제하고, 오직 이 클릭 이벤트를 통해서만 풀스크린이 가동됩니다.
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
